name: Prometeo CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  construir-y-subir:
    runs-on: ubuntu-latest
    
    steps:
    - name: 1. Descargar el codigo fuente
      uses: actions/checkout@v4

    - name: 2. Iniciar sesion en Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: 3. Construir y subir la imagen
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        # Nombra la imagen usando mi usuario de Docker Hub y le pone la etiqueta 'latest'
        tags: ${{ secrets.DOCKER_USERNAME }}/agente-sre:latest